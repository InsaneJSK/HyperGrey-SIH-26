<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title description">
<title id="title">CPU and Tesla T4 median solve times on synthetic box QP</title>
<desc id="description">Three repeats per size and backend, 45 checked runs. Synthetic planted tridiagonal box-constrained convex QP. Median solve time includes solver setup and CUDA transfers; whole-process startup and model generation are separate.</desc>
