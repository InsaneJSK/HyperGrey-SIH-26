<text x="64" y="124" font-size="39" fill="#eef4ff" font-weight="700" text-anchor="start" >GPU acceleration, measured across problem sizes</text>
<text x="64" y="167" font-size="24" fill="#a8b7cc" font-weight="400" text-anchor="start" >Synthetic sparse box-constrained convex QP · Tesla T4 · median of 3 repeats</text>
