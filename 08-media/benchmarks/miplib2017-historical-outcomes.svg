<text x="91" y="742" font-size="20" fill="#a8b7cc" font-weight="400" text-anchor="start" >69 feasible points = 7 numerical optima + 62 other checked points</text>
<text x="65" y="813" font-size="23" fill="#eef4ff" font-weight="400" text-anchor="start" >Original-model feasibility and integrality checked independently with HiGHS 1.12.0.</text>
<text x="65" y="853" font-size="21" fill="#a8b7cc" font-weight="400" text-anchor="start" >Optimal / infeasible claims agree with published MIPLIB results. Later engine revisions are separate.</text>
<text x="65" y="911" font-size="18" fill="#a8b7cc" font-weight="400" text-anchor="start" >Source: miplib2017-benchmark · shared Kaggle CPUs · outcome coverage, not a timing comparison</text>
</svg>
