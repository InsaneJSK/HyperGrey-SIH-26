<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640" role="img" aria-labelledby="title desc">
<title id="title">SolveForge core and service architecture</title>
<desc id="desc">Models enter the independent C++ solver, pass through presolve and the LP, MILP or convex QP engines, and return original-model checks and structured results. Eligible box QPs have a CUDA backend. The FastAPI adapter selects an explicitly configured Sovereign CLI or HiGHS reference engine.</desc>
