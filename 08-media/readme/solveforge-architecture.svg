<text x="44" y="49" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0f766e" letter-spacing="2">SOLVEFORGE / ARCHITECTURE</text>
<text x="44" y="92" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">One inspectable core. Checked decisions.</text>
<text x="44" y="123" font-family="Arial,sans-serif" font-size="17" fill="#526277">Independent C++ algorithms · Sparse numerical methods · Explicit engine and backend selection</text>

